name: Build mod
on:
  push:
  workflow_dispatch:
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '8'
      - name: Prepare project
        run: |
          curl -fL -o mdk.zip https://maven.minecraftforge.net/net/minecraftforge/forge/1.12.2-14.23.5.2860/forge-1.12.2-14.23.5.2860-mdk.zip
          mkdir mdk
          unzip -q mdk.zip -d mdk
          rm -rf mdk/src
          cp -r src mdk/src
          if grep -q "net.minecraftforge.client.event.InputEvent" mdk/src/main/java/pocketmod/ClientHandler.java; then
            sed -i 's/net.minecraftforge.client.event.InputEvent/net.minecraftforge.fml.common.gameevent.InputEvent/' mdk/src/main/java/pocketmod/ClientHandler.java || true
          fi
          cd mdk
          chmod +x gradlew
          sed -i 's#http://files.minecraftforge.net/maven#https://maven.minecraftforge.net#g' build.gradle
          sed -i 's#^archivesBaseName = .*#archivesBaseName = "pocketmod"#' build.gradle
      - name: Build
        working-directory: mdk
        run: ./gradlew build --no-daemon
      - uses: actions/upload-artifact@v4
        with:
          name: pocketmod-jar
          path: mdk/build/libs/*.jar
