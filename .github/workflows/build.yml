name: Build mod
on:
  push:
  workflow_dispatch:
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '8'
      - name: Pick sources (newest pocketmod-v*.zip in the repo root, otherwise ./src)
        run: |
          set -e
          ZIP=$(ls pocketmod-v*.zip 2>/dev/null | sort -V | tail -1 || true)
          rm -rf work
          mkdir work
          if [ -n "$ZIP" ]; then
            echo "Building from $ZIP"
            unzip -q "$ZIP" -d work
          else
            echo "No zip found, building from ./src"
            cp -r src work/src
          fi
          test -d work/src/main/java/pocketmod
          SHIELD=work/src/main/java/pocketmod/Shield.java
          if [ -f "$SHIELD" ]; then
            sed -i \
              -e 's/SoundEvents\.BLOCK_BEACON_ACTIVATE/SoundEvents.BLOCK_METAL_PRESSPLATE_CLICK_ON/g' \
              -e 's/SoundEvents\.BLOCK_BEACON_DEACTIVATE/SoundEvents.BLOCK_METAL_PRESSPLATE_CLICK_OFF/g' \
              "$SHIELD"
          fi
      - name: Apply 1.2 changes
        run: |
          set -e
          base64 -d .github/patches/pocketmod-1.2.py.gz.b64 | gzip -d > /tmp/patch_1_2.py
          python3 /tmp/patch_1_2.py work/src
      - name: Keep pocket dimension ticking while unattended
        run: |
          set -e
          python3 - <<'PY'
          from pathlib import Path
          root = Path("work/src/main")
          cfg = root / "java/pocketmod/PocketConfig.java"
          s = cfg.read_text()
          s = "\n".join(line for line in s.splitlines() if "pocketTickDrain" not in line) + "\n"
          cfg.write_text(s)
          tick = root / "java/pocketmod/ServerTick.java"
          s = tick.read_text()
          start = s.find("        if (player.dimension == PocketMod.DIM_ID && !player.isCreative() && !player.isSpectator()")
          if start >= 0:
              end = s.find("\n        long now = System.nanoTime()", start)
              if end < 0: raise SystemExit("Could not find end of pocket upkeep block")
              s = s[:start] + s[end:]
          tick.write_text(s)
          mod = root / "java/pocketmod/PocketMod.java"
          s = mod.read_text()
          needle = "        DimensionManager.registerDimension(DIM_ID, POCKET_TYPE);"
          if "DimensionManager.keepDimensionLoaded(DIM_ID, true);" not in s:
              if needle not in s: raise SystemExit("Could not find dimension registration")
              s = s.replace(needle, needle + "\n        // Keep the pocket dimension ticking even when its owner is outside.\n        DimensionManager.keepDimensionLoaded(DIM_ID, true);", 1)
          mod.write_text(s)
          for lang in (root / "resources/assets/pocketmod/lang").glob("*.lang"):
              s = "\n".join(line for line in lang.read_text().splitlines() if "pocketmod.msg.pocket_tick_empty=" not in line) + "\n"
              lang.write_text(s)
          PY
      - name: Package 1.2 source
        run: |
          cd work
          zip -qr ../pocketmod-v1.2.zip src
      - name: Export 1.2 source
        uses: actions/upload-artifact@v4
        with:
          name: pocketmod-source-v1.2
          path: pocketmod-v1.2.zip
          if-no-files-found: error
      - name: Prepare project
        run: |
          set -e
          curl -fL -o mdk.zip https://maven.minecraftforge.net/net/minecraftforge/forge/1.12.2-14.23.5.2860/forge-1.12.2-14.23.5.2860-mdk.zip
          mkdir mdk
          unzip -q mdk.zip -d mdk
          rm -rf mdk/src
          cp -r work/src mdk/src
          cd mdk
          chmod +x gradlew
          sed -i 's#http://files.minecraftforge.net/maven#https://maven.minecraftforge.net#g' build.gradle
          sed -i 's#^archivesBaseName = .*#archivesBaseName = "pocketmod"#' build.gradle
          sed -i 's#^version = .*#version = "1.2"#' build.gradle
      - name: Optional JourneyMap API (totem waypoints)
        run: |
          if [ -f work/jm/pocketmod/JmPlugin.java ] && git clone -q --depth 1 -b 1.12.2 https://github.com/TeamJM/journeymap-api.git jmapi; then
            cp -r jmapi/src/main/java/journeymap mdk/src/main/java/journeymap
            cp work/jm/pocketmod/JmPlugin.java mdk/src/main/java/pocketmod/JmPlugin.java
            printf '\njar { exclude "journeymap/**" }\n' >> mdk/build.gradle
            echo "JM=1" >> "$GITHUB_ENV"
          else
            echo "JourneyMap API not used"
          fi
      - name: Build
        working-directory: mdk
        run: |
          if ! ./gradlew build --no-daemon; then
            if [ "$JM" = "1" ]; then
              echo "Build with JourneyMap failed, retrying without it"
              rm -rf src/main/java/journeymap src/main/java/pocketmod/JmPlugin.java
              ./gradlew build --no-daemon
            else
              exit 1
            fi
          fi
      - uses: actions/upload-artifact@v4
        with:
          name: pocketmod-jar-v1.2
          path: mdk/build/libs/*.jar
