name: Build and publish Pocket Mod

on:
  push:
    branches: ['**']
    tags: ['v*']
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.version.outputs.version }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '8'
      - name: Read version
        id: version
        shell: bash
        run: |
          set -euo pipefail
          MODVER=$(tr -d '[:space:]' < version.txt)
          [[ "$MODVER" =~ ^[0-9]+(\.[0-9]+)+$ ]]
          if [[ "$GITHUB_REF" == refs/tags/v* ]]; then
            test "${GITHUB_REF_NAME#v}" = "$MODVER"
          fi
          echo "MODVER=$MODVER" >> "$GITHUB_ENV"
          echo "version=$MODVER" >> "$GITHUB_OUTPUT"
      - name: Cache Gradle and Forge downloads
        uses: actions/cache@v4
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
            mdk.zip
          key: forge-1.12.2-14.23.5.2860-${{ runner.os }}
          restore-keys: forge-1.12.2-
      - name: Prepare Forge MDK
        shell: bash
        run: |
          set -euo pipefail
          test -d src/main/java/pocketmod
          if [ ! -f mdk.zip ]; then
            curl --fail --location --retry 3 -o mdk.zip https://maven.minecraftforge.net/net/minecraftforge/forge/1.12.2-14.23.5.2860/forge-1.12.2-14.23.5.2860-mdk.zip
          fi
          mkdir mdk
          unzip -q mdk.zip -d mdk
          rm -rf mdk/src
          cp -r src mdk/src
          cd mdk
          chmod +x gradlew
          sed -i 's#http://files.minecraftforge.net/maven#https://maven.minecraftforge.net#g' build.gradle
          sed -i 's#^archivesBaseName = .*#archivesBaseName = "pocketmod"#' build.gradle
          sed -i "s#^version = .*#version = \"$MODVER\"#" build.gradle
          sed -i -E "s/version\s*=\s*\"[0-9]+(\.[0-9]+)*\"/version = \"$MODVER\"/" src/main/java/pocketmod/PocketMod.java
      - name: Test rhino attack decisions
        run: |
          mkdir -p /tmp/rhino-check
          javac -encoding UTF-8 -d /tmp/rhino-check src/main/java/pocketmod/RhinoTactics.java src/main/java/pocketmod/RhinoAnimation.java tests/java/pocketmod/RhinoTacticsSmoke.java tests/java/pocketmod/RhinoAnimationSmoke.java src/main/java/pocketmod/RhinoCoverRules.java tests/java/pocketmod/RhinoCoverSmoke.java
          java -cp /tmp/rhino-check pocketmod.RhinoTacticsSmoke
          java -cp /tmp/rhino-check pocketmod.RhinoAnimationSmoke
          java -cp /tmp/rhino-check pocketmod.RhinoCoverSmoke
      - name: Optional JourneyMap API
        if: hashFiles('optional/journeymap/JmPlugin.java') != ''
        shell: bash
        run: |
          cp optional/journeymap/JmPlugin.java mdk/src/main/java/pocketmod/JmPlugin.java
          cat >> mdk/build.gradle <<'GRADLE'
          repositories { mavenCentral() }
          dependencies { compile 'info.journeymap:journeymap-api:1.12-1.4' }
          GRADLE
      - name: Build
        working-directory: mdk
        run: ./gradlew build --no-daemon
      - name: Prepare direct downloads
        shell: bash
        run: |
          set -euo pipefail
          mkdir dist
          cp "mdk/build/libs/pocketmod-$MODVER.jar" dist/pocketmod.jar
          python3 - <<'PY'
          import zipfile
          with zipfile.ZipFile('dist/pocketmod.jar') as jar:
              assert jar.testzip() is None
              assert 'pocketmod/PocketMod.class' in jar.namelist()
              assert 'assets/pocketmod/lang/ru_ru.lang' in jar.namelist()
          PY
          git archive --format=zip --output=dist/pocketmod-source.zip HEAD
          (cd dist && sha256sum pocketmod.jar pocketmod-source.zip > SHA256SUMS)
      - uses: actions/upload-artifact@v4
        with:
          name: pocketmod-${{ github.sha }}
          path: dist/*
          if-no-files-found: error
      - name: Test release automation
        run: python3 -m unittest discover -s tests/delivery -v

  publish:
    needs: build
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    concurrency:
      group: pocketmod-release
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: pocketmod-${{ github.sha }}
          path: dist
      - name: Publish latest download
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_VERSION: ${{ needs.build.outputs.version }}
          RELEASE_SHA: ${{ github.sha }}
        run: python3 scripts/publish_release.py
